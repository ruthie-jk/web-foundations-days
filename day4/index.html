<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Day 4 Assignment</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Write your thoughts and keep track of your words.</p>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <section>
        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          rows="8"
          maxlength="10000"
          placeholder="Start typing your note here..."
        ></textarea>

        <div class="counters">
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>

        <button id="clear-btn" type="button">Clear</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
